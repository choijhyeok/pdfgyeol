name: Publish pdfgyeol to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_ref:
        description: Optional source commit or tag for a build-only test
        required: false
        type: string

permissions:
  contents: read

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check release source and tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if project["name"] != "pdfgyeol" or not Path("Cargo.lock").is_file():
              raise SystemExit("Select a pdfgyeol commit containing the Rust extension")
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != "v" + project["version"]:
              raise SystemExit(f"Tag {tag} must match v{project['version']}")
          PY
      - name: Build and check sdist
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  linux-wheel:
    name: Build and test Linux ${{ matrix.arch }}
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:55a36963bc0504cdf004011001c1072306402f0b8b83be5a5eba7068f93eec53
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:126d9eea9d6b1717f3e17b2b3ac51da04ef159a5f935dac36fe92d621dc8f246
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sdist
          path: source
      - name: Build a release wheel from the sdist
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir wheels
          docker run --rm -i -e ARCH -v "$PWD/source:/source:ro" -v "$PWD/wheels:/wheels" "$IMAGE" bash -seu <<'BUILD'
          set -o pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.87.0
          export PATH="$HOME/.cargo/bin:$PATH"
          export PDFGYEOL_BUILD_RUST=1
          /opt/python/cp311-cp311/bin/python -m pip wheel --no-deps -w /tmp/raw /source/*.tar.gz
          auditwheel repair --only-plat --plat "manylinux_2_28_$ARCH" -w /wheels /tmp/raw/*.whl
          auditwheel show /wheels/*.whl
          BUILD
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify installed Rust extension and public parser
        run: |
          python -m pip install wheels/*.whl 'pdfgyeol[test]' twine abi3audit
          python -m pip check
          python -m twine check --strict wheels/*.whl
          abi3audit --strict --summary wheels/*.whl
          tar xzf source/*.tar.gz
          python -m pytest -q pdfgyeol-*/tests
          python pdfgyeol-*/examples/make_riverside_notes.py notes.pdf
          python - <<'PY'
          from unittest.mock import patch
          from pdfgyeol import _native, parse_pdf

          with patch("pdfgyeol._native_extraction._parse_content", wraps=_native.parse_content) as lexer:
              accelerated = parse_pdf("notes.pdf").to_json(indent=None)
              assert lexer.called, "The parser did not call the native extension"
          with patch("pdfgyeol._native_extraction._parse_content", None):
              assert accelerated == parse_pdf("notes.pdf").to_json(indent=None)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: wheels/*.whl
          if-no-files-found: error

  publish:
    name: Publish distributions with Trusted Publishing
    if: github.event_name == 'release'
    needs: [sdist, linux-wheel]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pdfgyeol/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
